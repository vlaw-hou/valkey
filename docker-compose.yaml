services:
  valkey:
    image: valkey/valkey:latest
    container_name: valkey-server
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - VALKEY_EXTRA_FLAGS=--requirepass mysecurepassword --loglevel warning
    volumes:
      - valkey_data:/data

  valkey-admin:
    image: valkey/valkey-admin:latest
    container_name: valkey-admin-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DEPLOYMENT_MODE=Web
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_USERNAME=default
      - VALKEY_PASSWORD=mysecurepassword
    depends_on:
      - valkey

volumes:
  valkey_data:
    driver: local
